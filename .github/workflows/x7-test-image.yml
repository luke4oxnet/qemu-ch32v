# Builds the CI image for the EthRelax X7 Relays v2 firmware tests and publishes
# it as ghcr.io/luke4oxnet/qemu-ch32v-x7:<commit> and :latest. linux/amd64 only.
name: X7 test image

on:
  push:
    branches: [ x7-relays-v2 ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: x7-test-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/luke4oxnet/qemu-ch32v-x7

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/x7-test-image/Dockerfile
          platforms: linux/amd64
          load: true
          tags: x7-test-image:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: |
          docker run --rm x7-test-image:check sh -ec '
            qemu-system-riscv32-ch32 --version
            qemu-system-riscv32-ch32 -M help | grep ch32v307
            command -v mosquitto mosquitto_passwd openssl
            python3 -m pytest --version
          '

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/x7-test-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
